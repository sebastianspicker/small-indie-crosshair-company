name: Check and reproduce
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify and reproduce without npm installation
        run: npm run verify
      - name: Regenerated data, research and notebook must stay reproducible
        run: |
          git diff --exit-code -- research/generated/ data/ docs/notebook.html
          if [ -n "$(git status --porcelain -- data research docs)" ]; then
            echo "Untracked generated output under data/, research/ or docs/:" >&2
            git status --porcelain -- data research docs >&2
            exit 1
          fi

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Make this required after 10 consecutive green runs on main.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: pip install playwright==1.55.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Manual editor and calibration smoke checks
        run: python3 tests/browser/browser_smoke.py --output test-results/smoke
      - name: Quant converter browser checks
        run: python3 tests/browser/quant_browser.py --output test-results/quant
      - name: Upload browser check artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-check-results
          path: test-results/
          if-no-files-found: ignore
